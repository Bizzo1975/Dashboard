<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | Kecktech Portal</title>
  <link rel="stylesheet" href="/portal.css" />
</head>
<body>
  <header class="portal-header" role="banner">
    <div class="portal-header-inner">
      <a href="/" class="portal-logo">
        <div class="portal-logo-text">Kecktech IT Solutions<span class="portal-logo-sub">Client Portal</span></div>
      </a>
      <div class="portal-header-actions">
        <a href="https://auth.kecktech.net/logout" class="btn-signout" aria-label="Sign out of customer portal">Sign Out</a>
      </div>
    </div>
  </header>
  <main id="main-content">
    <section class="portal-section" style="text-align:center; padding: 80px 24px;">
      <div class="container">
        <h1 style="font-size: 64px; color: var(--gold);">404</h1>
        <h2 style="margin-bottom: 16px;">Page Not Found</h2>
        <p>The page you're looking for doesn't exist or has been moved.</p>
        <a href="/" class="btn btn-primary" style="margin-top: 24px;">Back to Portal</a>
      </div>
    </section>
  </main>
  <footer class="portal-footer" role="contentinfo">
    <div class="portal-footer-inner">
      <span>&copy; 2025 Kecktech IT Solutions</span>
      <a href="https://www.kecktech.net">kecktech.net</a>
    </div>
  </footer>

</html>
