server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript;
    gzip_min_length 512;

    location ~* \.(css|js|png|jpg|svg|ico|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Security headers — CSP permits Zammad chat scripts and WebSocket
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://tickets.kecktech.net; connect-src 'self' wss://tickets.kecktech.net https://tickets.kecktech.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://tickets.kecktech.net; font-src https://fonts.gstatic.com; img-src 'self' data: https://tickets.kecktech.net; frame-ancestors 'none';" always;

    error_page 404 /404.html;
}
