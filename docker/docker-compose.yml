# Kecktech stack — run from Dashboard/docker
# Project name preserves existing named volumes (vboxuser_freescout_data, etc.)
# Start everything from Dashboard root with ./startup-all
#
# REMOVED 2026-04: wordpress + wp-db (replaced by Astro kecktech-web)
#                  wikijs + wikijs-db (replaced by BookStack + Custom Wiki)
name: vboxuser

services:

  # ── REVERSE PROXY ────────────────────────────────────────────────────────────
  traefik:
    image: traefik:v3.6.10
    container_name: traefik
    restart: always
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./traefik/certs-local:/certs-local:ro
      - traefik_certs:/certs
    networks:
      - kecktech_front
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.kecktech.net`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls=true"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.middlewares=authelia@docker"

  # ── SSO — LLDAP (lightweight LDAP user directory) ────────────────────────────
  lldap:
    image: lldap/lldap:stable
    container_name: lldap
    restart: always
    mem_limit: 128m
    environment:
      - LLDAP_JWT_SECRET=${LLDAP_JWT_SECRET}
      - LLDAP_LDAP_BASE_DN=dc=kecktech,dc=net
      - LLDAP_LDAP_USER_PASS=${LLDAP_ADMIN_PASS}
      - LLDAP_HTTP_PORT=17170
      - TZ=America/Chicago
    volumes:
      - lldap_data:/data
    networks:
      - kecktech_front
      - kecktech_internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lldap.rule=Host(`lldap.kecktech.net`)"
      - "traefik.http.routers.lldap.entrypoints=websecure"
      - "traefik.http.routers.lldap.tls=true"
      - "traefik.http.services.lldap.loadbalancer.server.port=17170"
      - "traefik.http.routers.lldap.middlewares=authelia@docker"

  # ── SSO — AUTHELIA (forward-auth gateway) ────────────────────────────────────
  authelia:
    image: authelia/authelia:4.39.15
    container_name: authelia
    restart: always
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9091/api/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    volumes:
      - ./authelia:/config
    environment:
      - AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET=${AUTHELIA_JWT_SECRET}
      - AUTHELIA_SESSION_SECRET=${AUTHELIA_SESSION_SECRET}
      - AUTHELIA_STORAGE_ENCRYPTION_KEY=${AUTHELIA_STORAGE_KEY}
      - AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD=${LLDAP_ADMIN_PASS}
      - AUTHELIA_NOTIFIER_SMTP_PASSWORD=${AUTHELIA_NOTIFIER_SMTP_PASSWORD}
    extra_hosts:
      - "mail.kecktech.net:host-gateway"
    depends_on:
      - lldap
    networks:
      - kecktech_front
      - kecktech_internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.authelia.rule=Host(`auth.kecktech.net`)"
      - "traefik.http.routers.authelia.entrypoints=websecure"
      - "traefik.http.routers.authelia.tls=true"
      - "traefik.http.services.authelia.loadbalancer.server.port=9091"
      - "traefik.http.middlewares.authelia.forwardauth.address=http://authelia:9091/api/authz/forward-auth"
      - "traefik.http.middlewares.authelia.forwardauth.trustForwardHeader=true"
      - "traefik.http.middlewares.authelia.forwardauth.authResponseHeaders=Remote-User,Remote-Groups,Remote-Name,Remote-Email"

  # ── SERVICE DESK — ZAMMAD ─────────────────────────────────────────────────────
  zammad-db:
    image: postgres:15-alpine
    container_name: zammad-db
    mem_limit: 256m
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zammad"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      - POSTGRES_DB=zammad
      - POSTGRES_USER=zammad
      - POSTGRES_PASSWORD=${ZAMMAD_DB_PASS}
    volumes:
      - zammad_db_data:/var/lib/postgresql/data
    networks:
      - kecktech_internal

  zammad-redis:
    image: redis:7-alpine
    container_name: zammad-redis
    mem_limit: 128m
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - kecktech_internal

  zammad-init:
    image: ghcr.io/zammad/zammad:latest
    container_name: zammad-init
    command: ["zammad-init"]
    restart: on-failure
    environment:
      - POSTGRESQL_HOST=zammad-db
      - POSTGRESQL_PORT=5432
      - POSTGRESQL_USER=zammad
      - POSTGRESQL_PASS=${ZAMMAD_DB_PASS}
      - POSTGRESQL_DB=zammad
      - REDIS_URL=redis://zammad-redis:6379
      - SECRET_KEY_BASE=${ZAMMAD_SECRET_KEY}
      - FQDN=tickets.kecktech.net
      - ELASTICSEARCH_ENABLED=false
    volumes:
      - zammad_storage:/opt/zammad/storage
    depends_on:
      zammad-db:
        condition: service_healthy
      zammad-redis:
        condition: service_healthy
    networks:
      - kecktech_internal

  zammad-railsserver:
    image: ghcr.io/zammad/zammad:latest
    container_name: zammad-railsserver
    mem_limit: 512m
    command: ["zammad-railsserver"]
    restart: always
    environment:
      - POSTGRESQL_HOST=zammad-db
      - POSTGRESQL_PORT=5432
      - POSTGRESQL_USER=zammad
      - POSTGRESQL_PASS=${ZAMMAD_DB_PASS}
      - POSTGRESQL_DB=zammad
      - REDIS_URL=redis://zammad-redis:6379
      - SECRET_KEY_BASE=${ZAMMAD_SECRET_KEY}
      - FQDN=tickets.kecktech.net
      - ELASTICSEARCH_ENABLED=false
    extra_hosts:
      - "kecktech.net:host-gateway"
      - "www.kecktech.net:host-gateway"
      - "admin.kecktech.net:host-gateway"
      - "tickets.kecktech.net:host-gateway"
      - "n8n.kecktech.net:host-gateway"
      - "portal.kecktech.net:host-gateway"
      - "mail.kecktech.net:host-gateway"
      - "auth.kecktech.net:host-gateway"
      - "ops.kecktech.net:host-gateway"
    volumes:
      - zammad_storage:/opt/zammad/storage
      - ./zammad/custom.css:/opt/zammad/app/assets/stylesheets/custom/kecktech.css:ro
    depends_on:
      - zammad-init
      - zammad-db
      - zammad-redis
    networks:
      - kecktech_internal

  zammad-nginx:
    image: ghcr.io/zammad/zammad:latest
    container_name: zammad-nginx
    mem_limit: 512m
    command: ["zammad-nginx"]
    restart: always
    environment:
      - POSTGRESQL_HOST=zammad-db
      - POSTGRESQL_PORT=5432
      - POSTGRESQL_USER=zammad
      - POSTGRESQL_PASS=${ZAMMAD_DB_PASS}
      - POSTGRESQL_DB=zammad
      - REDIS_URL=redis://zammad-redis:6379
      - SECRET_KEY_BASE=${ZAMMAD_SECRET_KEY}
      - NGINX_PORT=8080
      - NGINX_SERVER_SCHEME=https
      - ZAMMAD_RAILSSERVER_HOST=zammad-railsserver
      - ZAMMAD_RAILSSERVER_PORT=3000
      - ZAMMAD_WEBSOCKET_HOST=zammad-websocket
      - ZAMMAD_WEBSOCKET_PORT=6042
      - ELASTICSEARCH_ENABLED=false
    extra_hosts:
      - "kecktech.net:host-gateway"
      - "www.kecktech.net:host-gateway"
      - "admin.kecktech.net:host-gateway"
      - "tickets.kecktech.net:host-gateway"
      - "n8n.kecktech.net:host-gateway"
      - "portal.kecktech.net:host-gateway"
      - "mail.kecktech.net:host-gateway"
      - "auth.kecktech.net:host-gateway"
      - "ops.kecktech.net:host-gateway"
    depends_on:
      - zammad-railsserver
    networks:
      - kecktech_front
      - kecktech_internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.zammad.rule=Host(`support.kecktech.net`) || Host(`tickets.kecktech.net`)"
      - "traefik.http.routers.zammad.entrypoints=websecure"
      - "traefik.http.routers.zammad.tls=true"
      - "traefik.http.services.zammad.loadbalancer.server.port=8080"

  zammad-scheduler:
    image: ghcr.io/zammad/zammad:latest
    container_name: zammad-scheduler
    mem_limit: 256m
    command: ["zammad-scheduler"]
    restart: always
    environment:
      - POSTGRESQL_HOST=zammad-db
      - POSTGRESQL_PORT=5432
      - POSTGRESQL_USER=zammad
      - POSTGRESQL_PASS=${ZAMMAD_DB_PASS}
      - POSTGRESQL_DB=zammad
      - REDIS_URL=redis://zammad-redis:6379
      - SECRET_KEY_BASE=${ZAMMAD_SECRET_KEY}
      - FQDN=tickets.kecktech.net
      - ELASTICSEARCH_ENABLED=false
    extra_hosts:
      - "mail.kecktech.net:host-gateway"
    volumes:
      - zammad_storage:/opt/zammad/storage
    depends_on:
      - zammad-railsserver
    networks:
      - kecktech_internal

  zammad-websocket:
    image: ghcr.io/zammad/zammad:latest
    container_name: zammad-websocket
    mem_limit: 128m
    command: ["zammad-websocket"]
    restart: always
    environment:
      - POSTGRESQL_HOST=zammad-db
      - POSTGRESQL_PORT=5432
      - POSTGRESQL_USER=zammad
      - POSTGRESQL_PASS=${ZAMMAD_DB_PASS}
      - POSTGRESQL_DB=zammad
      - REDIS_URL=redis://zammad-redis:6379
      - SECRET_KEY_BASE=${ZAMMAD_SECRET_KEY}
      - FQDN=tickets.kecktech.net
      - ELASTICSEARCH_ENABLED=false
    depends_on:
      - zammad-railsserver
    networks:
      - kecktech_internal

  # ── SECRETS / CLIENT PROFILES ─────────────────────────────────────────────────
  vaultwarden:
    image: vaultwarden/server:1.35.4
    container_name: vaultwarden
    restart: always
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/alive"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - vaultwarden_data:/data
    environment:
      - ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN}
      - DOMAIN=https://vault.kecktech.net
      - SIGNUPS_ALLOWED=false
      - INVITATIONS_ALLOWED=true
      - SMTP_HOST=mail.kecktech.net
      - SMTP_FROM=admin@kecktech.net
      - SMTP_PORT=587
      - SMTP_SECURITY=starttls
      - SMTP_USERNAME=admin@kecktech.net
      - SMTP_PASSWORD=${MAILCOW_ADMIN_PASS}
      - SMTP_ACCEPT_INVALID_CERTS=true
      - SMTP_ACCEPT_INVALID_HOSTNAMES=true
    extra_hosts:
      - "mail.kecktech.net:host-gateway"
    networks:
      - kecktech_front
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vaultwarden.rule=Host(`vault.kecktech.net`)"
      - "traefik.http.routers.vaultwarden.entrypoints=websecure"
      - "traefik.http.routers.vaultwarden.tls=true"
      - "traefik.http.services.vaultwarden.loadbalancer.server.port=80"

  # ── WORKFLOW / SMS ────────────────────────────────────────────────────────────
  n8n:
    image: n8nio/n8n:2.11.2
    container_name: n8n
    restart: always
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    environment:
      - N8N_HOST=n8n.kecktech.net
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://n8n.kecktech.net/
      - GENERIC_TIMEZONE=America/Chicago
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_DEFAULT_USER_EMAIL=admin@kecktech.net
      - N8N_DEFAULT_USER_PASSWORD=${N8N_DEFAULT_PASS}
    extra_hosts:
      - "kecktech.net:host-gateway"
      - "www.kecktech.net:host-gateway"
      - "admin.kecktech.net:host-gateway"
      - "tickets.kecktech.net:host-gateway"
      - "n8n.kecktech.net:host-gateway"
      - "portal.kecktech.net:host-gateway"
      - "mail.kecktech.net:host-gateway"
      - "auth.kecktech.net:host-gateway"
      - "ops.kecktech.net:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - kecktech_front
      - kecktech_internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`n8n.kecktech.net`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls=true"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"

  # ── ANALYTICS ─────────────────────────────────────────────────────────────────
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: umami
    restart: always
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/heartbeat"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      - DATABASE_URL=postgresql://umami:${UMAMI_DB_PASS}@umami-db:5432/umami
      - APP_SECRET=${UMAMI_APP_SECRET}
    depends_on:
      - umami-db
    networks:
      - kecktech_front
      - kecktech_internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.umami.rule=Host(`umami.kecktech.net`) || Host(`stats.kecktech.net`)"
      - "traefik.http.routers.umami.entrypoints=websecure"
      - "traefik.http.routers.umami.tls=true"
      - "traefik.http.services.umami.loadbalancer.server.port=3000"
      - "traefik.http.routers.umami.middlewares=authelia@docker"

  umami-db:
    image: postgres:15-alpine
    container_name: umami-db
    restart: always
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      - POSTGRES_DB=umami
      - POSTGRES_USER=umami
      - POSTGRES_PASSWORD=${UMAMI_DB_PASS}
    volumes:
      - umami_db_data:/var/lib/postgresql/data
    networks:
      - kecktech_internal

  # ── REMOTE ACCESS — RUSTDESK ──────────────────────────────────────────────────
  # RustDesk requires direct TCP/UDP — ports kept open via UFW rules
  rustdesk-relay:
    image: rustdesk/rustdesk-server:1.1.15
    container_name: rustdesk-relay
    command: hbbr
    volumes:
      - ./data/rustdesk_data:/root
    ports:
      - "21117:21117/tcp"
      - "21119:21119/tcp"
    restart: unless-stopped
    networks:
      - kecktech_front

  rustdesk-id:
    image: rustdesk/rustdesk-server:1.1.15
    container_name: rustdesk-id
    command: hbbs
    volumes:
      - ./data/rustdesk_data:/root
    ports:
      - "21115:21115/tcp"
      - "21116:21116/tcp"
      - "21116:21116/udp"
      - "21118:21118/tcp"
    depends_on:
      - rustdesk-relay
    restart: unless-stopped
    networks:
      - kecktech_front

  # ── INTERNAL DASHBOARD (Next.js) ──────────────────────────────────────────────
  dashboard:
    build:
      context: ../dashboard
      dockerfile: Dockerfile
    image: kecktech/dashboard:latest
    container_name: dashboard
    restart: always
    mem_limit: 256m
    environment:
      - ZAMMAD_URL=https://tickets.kecktech.net
      - ZAMMAD_API_TOKEN=${ZAMMAD_API_TOKEN}
      - TRMM_URL=https://api.kecktech.net
      - TRMM_API_KEY=${TRMM_API_KEY}
      - ERPNEXT_URL=https://ops.kecktech.net
      - ERPNEXT_API_KEY=${ERPNEXT_API_KEY}
      - ERPNEXT_API_SECRET=${ERPNEXT_API_SECRET}
      - UMAMI_URL=https://stats.kecktech.net
      - UMAMI_USER=admin
      - UMAMI_PASS=${UMAMI_PASS}
      - UMAMI_SITE_ID=d2427fe3-ce4b-4b9a-8e41-a8a3e9f2cd6d
      - LLDAP_URL=https://lldap.kecktech.net
      - LLDAP_ADMIN_USER=${LLDAP_ADMIN_USER:-admin}
      - LLDAP_ADMIN_PASS=${LLDAP_ADMIN_PASS}
      - RUSTDESK_SERVER_HOST=${RUSTDESK_SERVER_HOST}
      - RUSTDESK_PUBLIC_KEY=${RUSTDESK_PUBLIC_KEY}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://0.0.0.0:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - kecktech_front
      - kecktech_internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`dash.kecktech.net`) || Host(`dashboard.kecktech.net`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.services.dashboard.loadbalancer.server.port=3000"
      - "traefik.http.routers.dashboard.middlewares=authelia@docker"

  # ── CONTAINER MANAGEMENT ──────────────────────────────────────────────────────
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    ports:
      - "127.0.0.1:9443:9443"
      - "127.0.0.1:8000:8000"
    networks:
      - kecktech_front

  # ── PUBLIC WEBSITE — Astro static site ───────────────────────────────────────
  kecktech-web:
    image: nginx:alpine
    container_name: kecktech-web
    restart: always
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - ../website/dist:/usr/share/nginx/html:ro
      - ../website/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - kecktech_front
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kecktech-web.rule=Host(`www.kecktech.net`)"
      - "traefik.http.routers.kecktech-web.entrypoints=websecure"
      - "traefik.http.routers.kecktech-web.tls=true"
      - "traefik.http.services.kecktech-web.loadbalancer.server.port=80"

  # ── CONTACT FORM — PHP mailer ─────────────────────────────────────────────────
  kecktech-mailer:
    image: php:8.2-apache
    container_name: kecktech-mailer
    restart: always
    mem_limit: 64m
    extra_hosts:
      - "kecktech.net:host-gateway"
      - "www.kecktech.net:host-gateway"
      - "n8n.kecktech.net:host-gateway"
      - "tickets.kecktech.net:host-gateway"
      - "mail.kecktech.net:host-gateway"
    volumes:
      - ../website/api:/var/www/html:ro
    networks:
      - kecktech_front
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kecktech-mailer.rule=Host(`www.kecktech.net`) && PathPrefix(`/api`)"
      - "traefik.http.routers.kecktech-mailer.entrypoints=websecure"
      - "traefik.http.routers.kecktech-mailer.tls=true"
      - "traefik.http.routers.kecktech-mailer.priority=10"
      - "traefik.http.services.kecktech-mailer.loadbalancer.server.port=80"

  # ── CUSTOMER PORTAL — Next.js (Authelia-gated) ───────────────────────────────
  kecktech-portal:
    build:
      context: ../customer-portal
      dockerfile: Dockerfile
    container_name: kecktech-portal
    restart: always
    mem_limit: 512m
    environment:
      - NODE_ENV=production
      - PORTAL_BASE_URL=http://kecktech-portal:3012
      - ZAMMAD_URL=${ZAMMAD_URL:-https://tickets.kecktech.net}
      - ZAMMAD_API_TOKEN=${ZAMMAD_API_TOKEN}
      - ERPNEXT_URL=${ERPNEXT_URL:-https://ops.kecktech.net}
      - ERPNEXT_API_KEY=${ERPNEXT_API_KEY}
      - ERPNEXT_API_SECRET=${ERPNEXT_API_SECRET}
      - RUSTDESK_SERVER_HOST=${RUSTDESK_SERVER_HOST}
      - RUSTDESK_PUBLIC_KEY=${RUSTDESK_PUBLIC_KEY}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3012/api/health"]
      interval: 30s
      timeout: 8s
      retries: 3
    networks:
      - kecktech_front
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portal.rule=Host(`portal.kecktech.net`)"
      - "traefik.http.routers.portal.entrypoints=websecure"
      - "traefik.http.routers.portal.tls=true"
      - "traefik.http.services.portal.loadbalancer.server.port=3012"
      - "traefik.http.routers.portal.middlewares=authelia@docker"

  # ── SITE ADMIN — Content editor (Authelia-gated) ─────────────────────────────
  kecktech-admin:
    build:
      context: ..
      dockerfile: docker/Dockerfile.admin
    container_name: kecktech-admin
    restart: always
    mem_limit: 512m
    extra_hosts:
      - "kecktech.net:host-gateway"
      - "www.kecktech.net:host-gateway"
      - "admin.kecktech.net:host-gateway"
      - "n8n.kecktech.net:host-gateway"
      - "mail.kecktech.net:host-gateway"
    volumes:
      - ../website/src/data:/website/src/data
      - ../website/dist:/website/dist
      - ../website/public/images:/website/public/images
    networks:
      - kecktech_front
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kecktech-admin.rule=Host(`admin.kecktech.net`)"
      - "traefik.http.routers.kecktech-admin.entrypoints=websecure"
      - "traefik.http.routers.kecktech-admin.tls=true"
      - "traefik.http.routers.kecktech-admin.middlewares=authelia@docker,admin-ratelimit@file"
      - "traefik.http.services.kecktech-admin.loadbalancer.server.port=3000"

  # ── BOOKSTACK — Internal staff wiki ──────────────────────────────────────────
  bookstack:
    image: lscr.io/linuxserver/bookstack:latest
    container_name: bookstack
    restart: always
    mem_limit: 512m
    depends_on:
      - bookstack-db
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
      - APP_URL=https://bookstack.kecktech.net
      - APP_THEME=kecktech
      - APP_KEY=${BOOKSTACK_APP_KEY}
      - DB_HOST=bookstack-db
      - DB_PORT=3306
      - DB_DATABASE=bookstack
      - DB_USER=bookstack
      - DB_PASS=${BOOKSTACK_DB_PASS}
    volumes:
      - bookstack_data:/config
      - ./bookstack/custom.css:/config/www/themes/kecktech/custom.css:ro
      - ./bookstack/theme/views/layouts/parts/header.blade.php:/config/www/themes/kecktech/layouts/parts/header.blade.php:ro
      - ./bookstack/theme/views/layouts/parts/header-links.blade.php:/config/www/themes/kecktech/layouts/parts/header-links.blade.php:ro
      - ./bookstack/theme/views/layouts/parts/header-logo.blade.php:/config/www/themes/kecktech/layouts/parts/header-logo.blade.php:ro
      - ./bookstack/theme/views/home/default.blade.php:/config/www/themes/kecktech/home/default.blade.php:ro
      - ./bookstack/theme/views/entities/list-item-basic.blade.php:/config/www/themes/kecktech/entities/list-item-basic.blade.php:ro
    networks:
      - kecktech_front
      - kecktech_internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bookstack.rule=Host(`kb.kecktech.net`) || Host(`bookstack.kecktech.net`) || Host(`docs.kecktech.net`)"
      - "traefik.http.routers.bookstack.entrypoints=websecure"
      - "traefik.http.routers.bookstack.tls=true"
      - "traefik.http.services.bookstack.loadbalancer.server.port=80"

  bookstack-db:
    image: mariadb:10
    container_name: bookstack-db
    restart: always
    mem_limit: 256m
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASS}
      - MYSQL_DATABASE=bookstack
      - MYSQL_USER=bookstack
      - MYSQL_PASSWORD=${BOOKSTACK_DB_PASS}
    volumes:
      - bookstack_db_data:/var/lib/mysql
    networks:
      - kecktech_internal

  # ── CUSTOM WIKI — Public help center (help.kecktech.net) ─────────────────────
  custom-wiki:
    build:
      context: ../custom-wiki
      dockerfile: Dockerfile
    container_name: custom-wiki
    restart: always
    mem_limit: 512m
    depends_on:
      - custom-wiki-db
    environment:
      - DATABASE_URL=postgresql://customwiki:${CUSTOM_WIKI_DB_PASS}@custom-wiki-db:5432/customwiki?schema=public
      - CUSTOM_WIKI_API_TOKEN=${CUSTOM_WIKI_API_TOKEN}
    networks:
      - kecktech_front
      - kecktech_internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.custom-wiki.rule=Host(`help.kecktech.net`)"
      - "traefik.http.routers.custom-wiki.entrypoints=websecure"
      - "traefik.http.routers.custom-wiki.tls=true"
      - "traefik.http.services.custom-wiki.loadbalancer.server.port=3011"

  custom-wiki-db:
    image: postgres:15-alpine
    container_name: custom-wiki-db
    restart: always
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customwiki"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      - POSTGRES_DB=customwiki
      - POSTGRES_USER=customwiki
      - POSTGRES_PASSWORD=${CUSTOM_WIKI_DB_PASS}
    volumes:
      - custom_wiki_db_data:/var/lib/postgresql/data
    networks:
      - kecktech_internal

networks:
  kecktech_front:
    external: true
  kecktech_internal:
    external: true

volumes:
  zammad_db_data:
  zammad_storage:
  bookstack_data:
  bookstack_db_data:
  vaultwarden_data:
  portainer_data:
  lldap_data:
  n8n_data:
  umami_db_data:
  traefik_certs:
  custom_wiki_db_data:
  # NOTE: wikijs_data, wikijs_db_data removed — WikiJS replaced by BookStack + Custom Wiki
  # NOTE: wp_data / db_data are bind-mounted under ./data/ — stop wordpress container then
  #       delete ./data/wp_data and ./data/db_data directories to reclaim disk space
