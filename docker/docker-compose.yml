# Kecktech stack — run from Dashboard/docker
# Project name preserves existing named volumes (vboxuser_freescout_data, etc.)
# Start everything from Dashboard root with ./startup-all
name: vboxuser

services:

  # ── REVERSE PROXY ────────────────────────────────────────────────────────────
  traefik:
    image: traefik:v3.6.10
    container_name: traefik
    restart: always
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      # mkcert / manual PEMs — see docs/HTTPS-TEST-ENV.md and scripts/setup-mkcert-traefik.ps1
      - ./traefik/certs-local:/certs-local:ro
      - traefik_certs:/certs
    networks:
      - kecktech_front
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.kecktech.net`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls=true"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.middlewares=authelia@docker"

  # ── SSO — LLDAP (lightweight LDAP user directory) ────────────────────────────
  lldap:
    image: lldap/lldap:stable
    container_name: lldap
    restart: always
    mem_limit: 128m
    environment:
      - LLDAP_JWT_SECRET=${LLDAP_JWT_SECRET}
      - LLDAP_LDAP_BASE_DN=dc=kecktech,dc=net
      - LLDAP_LDAP_USER_PASS=${LLDAP_ADMIN_PASS}
      - LLDAP_HTTP_PORT=17170
      - TZ=America/Chicago
    volumes:
      - lldap_data:/data
    networks:
      - kecktech_front
      - kecktech_internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lldap.rule=Host(`lldap.kecktech.net`)"
      - "traefik.http.routers.lldap.entrypoints=websecure"
      - "traefik.http.routers.lldap.tls=true"
      - "traefik.http.services.lldap.loadbalancer.server.port=17170"
      - "traefik.http.routers.lldap.middlewares=authelia@docker"

  # ── SSO — AUTHELIA (forward-auth gateway) ────────────────────────────────────
  # Phase 5: SSO enforcement active. Middleware applied to: dashboard, lldap, traefik, umami.
  # freescout/n8n/vaultwarden excluded intentionally (own auth / webhooks would break).
  authelia:
    image: authelia/authelia:4.39.15
    container_name: authelia
    restart: always
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9091/api/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    volumes:
      - ./authelia:/config
    environment:
      - AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET=${AUTHELIA_JWT_SECRET}
      - AUTHELIA_SESSION_SECRET=${AUTHELIA_SESSION_SECRET}
      - AUTHELIA_STORAGE_ENCRYPTION_KEY=${AUTHELIA_STORAGE_KEY}
      - AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD=${LLDAP_ADMIN_PASS}
      - AUTHELIA_NOTIFIER_SMTP_PASSWORD=${AUTHELIA_NOTIFIER_SMTP_PASSWORD}
    extra_hosts:
      - "mail.kecktech.net:host-gateway"
    depends_on:
      - lldap
    networks:
      - kecktech_front
      - kecktech_internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.authelia.rule=Host(`auth.kecktech.net`)"
      - "traefik.http.routers.authelia.entrypoints=websecure"
      - "traefik.http.routers.authelia.tls=true"
      - "traefik.http.services.authelia.loadbalancer.server.port=9091"
      # Forward-auth middleware — add to other routers in Phase 5:
      # traefik.http.routers.<name>.middlewares=authelia@docker
      - "traefik.http.middlewares.authelia.forwardauth.address=http://authelia:9091/api/authz/forward-auth"
      - "traefik.http.middlewares.authelia.forwardauth.trustForwardHeader=true"
      - "traefik.http.middlewares.authelia.forwardauth.authResponseHeaders=Remote-User,Remote-Groups,Remote-Name,Remote-Email"

  # ── SERVICE DESK — ZAMMAD ─────────────────────────────────────────────────────
  # Replaces FreeScout. Full ITSM: SLA, time tracking, email channels, REST API.
  # First boot runs DB migrations automatically via zammad-init (exits after setup).
  # Manual setup required after first start: browse to tickets.kecktech.net to create
  # admin account, configure email channel, groups, and SLA policies.
  # Generate ZAMMAD_SECRET_KEY with: openssl rand -hex 64
  zammad-db:
    image: postgres:15-alpine
    container_name: zammad-db
    mem_limit: 256m
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zammad"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      - POSTGRES_DB=zammad
      - POSTGRES_USER=zammad
      - POSTGRES_PASSWORD=${ZAMMAD_DB_PASS}
    volumes:
      - zammad_db_data:/var/lib/postgresql/data
    networks:
      - kecktech_internal

  zammad-redis:
    image: redis:7-alpine
    container_name: zammad-redis
    mem_limit: 128m
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - kecktech_internal

  zammad-init:
    image: ghcr.io/zammad/zammad:latest
    container_name: zammad-init
    command: ["zammad-init"]
    restart: on-failure
    environment:
      - POSTGRESQL_HOST=zammad-db
      - POSTGRESQL_PORT=5432
      - POSTGRESQL_USER=zammad
      - POSTGRESQL_PASS=${ZAMMAD_DB_PASS}
      - POSTGRESQL_DB=zammad
      - REDIS_URL=redis://zammad-redis:6379
      - SECRET_KEY_BASE=${ZAMMAD_SECRET_KEY}
      - FQDN=tickets.kecktech.net
      - ELASTICSEARCH_ENABLED=false
    volumes:
      - zammad_storage:/opt/zammad/storage
    depends_on:
      zammad-db:
        condition: service_healthy
      zammad-redis:
        condition: service_healthy
    networks:
      - kecktech_internal

  zammad-railsserver:
    image: ghcr.io/zammad/zammad:latest
    container_name: zammad-railsserver
    mem_limit: 512m
    command: ["zammad-railsserver"]
    restart: always
    environment:
      - POSTGRESQL_HOST=zammad-db
      - POSTGRESQL_PORT=5432
      - POSTGRESQL_USER=zammad
      - POSTGRESQL_PASS=${ZAMMAD_DB_PASS}
      - POSTGRESQL_DB=zammad
      - REDIS_URL=redis://zammad-redis:6379
      - SECRET_KEY_BASE=${ZAMMAD_SECRET_KEY}
      - FQDN=tickets.kecktech.net
      - ELASTICSEARCH_ENABLED=false
    extra_hosts:
      - "mail.kecktech.net:host-gateway"
    volumes:
      - zammad_storage:/opt/zammad/storage
    depends_on:
      - zammad-init
      - zammad-db
      - zammad-redis
    networks:
      - kecktech_internal

  zammad-nginx:
    image: ghcr.io/zammad/zammad:latest
    container_name: zammad-nginx
    mem_limit: 512m    # startup readiness check loads full Rails (~400MB); drops to ~10MB after
    command: ["zammad-nginx"]
    restart: always
    environment:
      - POSTGRESQL_HOST=zammad-db
      - POSTGRESQL_PORT=5432
      - POSTGRESQL_USER=zammad
      - POSTGRESQL_PASS=${ZAMMAD_DB_PASS}
      - POSTGRESQL_DB=zammad
      - REDIS_URL=redis://zammad-redis:6379
      - SECRET_KEY_BASE=${ZAMMAD_SECRET_KEY}
      - NGINX_PORT=8080
      - ZAMMAD_RAILSSERVER_HOST=zammad-railsserver
      - ZAMMAD_RAILSSERVER_PORT=3000
      - ZAMMAD_WEBSOCKET_HOST=zammad-websocket
      - ZAMMAD_WEBSOCKET_PORT=6042
      - ELASTICSEARCH_ENABLED=false
    depends_on:
      - zammad-railsserver
    networks:
      - kecktech_front
      - kecktech_internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.zammad.rule=Host(`tickets.kecktech.net`)"
      - "traefik.http.routers.zammad.entrypoints=websecure"
      - "traefik.http.routers.zammad.tls=true"
      - "traefik.http.services.zammad.loadbalancer.server.port=8080"
      # No Authelia — clients need unauthenticated access to the ticket portal

  zammad-scheduler:
    image: ghcr.io/zammad/zammad:latest
    container_name: zammad-scheduler
    mem_limit: 256m
    command: ["zammad-scheduler"]
    restart: always
    environment:
      - POSTGRESQL_HOST=zammad-db
      - POSTGRESQL_PORT=5432
      - POSTGRESQL_USER=zammad
      - POSTGRESQL_PASS=${ZAMMAD_DB_PASS}
      - POSTGRESQL_DB=zammad
      - REDIS_URL=redis://zammad-redis:6379
      - SECRET_KEY_BASE=${ZAMMAD_SECRET_KEY}
      - FQDN=tickets.kecktech.net
      - ELASTICSEARCH_ENABLED=false
    extra_hosts:
      - "mail.kecktech.net:host-gateway"
    volumes:
      - zammad_storage:/opt/zammad/storage
    depends_on:
      - zammad-railsserver
    networks:
      - kecktech_internal

  zammad-websocket:
    image: ghcr.io/zammad/zammad:latest
    container_name: zammad-websocket
    mem_limit: 128m
    command: ["zammad-websocket"]
    restart: always
    environment:
      - POSTGRESQL_HOST=zammad-db
      - POSTGRESQL_PORT=5432
      - POSTGRESQL_USER=zammad
      - POSTGRESQL_PASS=${ZAMMAD_DB_PASS}
      - POSTGRESQL_DB=zammad
      - REDIS_URL=redis://zammad-redis:6379
      - SECRET_KEY_BASE=${ZAMMAD_SECRET_KEY}
      - FQDN=tickets.kecktech.net
      - ELASTICSEARCH_ENABLED=false
    depends_on:
      - zammad-railsserver
    networks:
      - kecktech_internal

  # ── SECRETS / CLIENT PROFILES ─────────────────────────────────────────────────
  vaultwarden:
    image: vaultwarden/server:1.35.4
    container_name: vaultwarden
    restart: always
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/alive"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - vaultwarden_data:/data
    environment:
      - ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN}
      - DOMAIN=https://vault.kecktech.net
      - SIGNUPS_ALLOWED=false
      - INVITATIONS_ALLOWED=true
      - SMTP_HOST=mail.kecktech.net
      - SMTP_FROM=admin@kecktech.net
      - SMTP_PORT=587
      - SMTP_SECURITY=starttls
      - SMTP_USERNAME=admin@kecktech.net
      - SMTP_PASSWORD=${MAILCOW_ADMIN_PASS}
      - SMTP_ACCEPT_INVALID_CERTS=true
      - SMTP_ACCEPT_INVALID_HOSTNAMES=true
    extra_hosts:
      - "mail.kecktech.net:host-gateway"
    networks:
      - kecktech_front
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vaultwarden.rule=Host(`vault.kecktech.net`)"
      - "traefik.http.routers.vaultwarden.entrypoints=websecure"
      - "traefik.http.routers.vaultwarden.tls=true"
      - "traefik.http.services.vaultwarden.loadbalancer.server.port=80"

  # ── WORKFLOW / SMS ────────────────────────────────────────────────────────────
  n8n:
    image: n8nio/n8n:2.11.2
    container_name: n8n
    restart: always
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    environment:
      - N8N_HOST=n8n.kecktech.net
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://n8n.kecktech.net/
      - GENERIC_TIMEZONE=America/Chicago
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_DEFAULT_USER_EMAIL=admin@kecktech.net
      - N8N_DEFAULT_USER_PASSWORD=${N8N_DEFAULT_PASS}
      # NODE_TLS_REJECT_UNAUTHORIZED: REMOVE in production; use per-credential "Ignore SSL Issues" instead
    extra_hosts:
      - "mail.kecktech.net:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - kecktech_front
      - kecktech_internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`n8n.kecktech.net`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls=true"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"

  # ── PUBLIC WEBSITE ────────────────────────────────────────────────────────────
  wordpress:
    image: wordpress:6.9.1
    container_name: wordpress
    mem_limit: 512m
    # Static asset: a request to / can hang (bootstrap/redirect) and leave the container
    # "unhealthy"; Traefik then omits the router → 404 for kecktech.net (see Traefik Docker provider).
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/wp-includes/images/w-logo-blue.png"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      - WORDPRESS_DB_HOST=wp-db
      - WORDPRESS_DB_USER=wpuser
      - WORDPRESS_DB_PASSWORD=${WP_DB_PASS}
      - WORDPRESS_DB_NAME=wpdb
      # Public URL for permalinks and media src (DB siteurl/home often wrong in Docker; breaks logo <img> behind Traefik).
      - WORDPRESS_CONFIG_EXTRA=if(!defined('WP_HOME')){define('WP_HOME','https://www.kecktech.net');}if(!defined('WP_SITEURL')){define('WP_SITEURL','https://www.kecktech.net');}
    extra_hosts:
      - "mail.kecktech.net:host-gateway"
    restart: always
    volumes:
      - ./data/wp_data:/var/www/html
      # Bundled logo + MU plugin (see docker/wordpress/README.md)
      - ./wordpress/branding:/var/www/html/wp-content/uploads/kecktech-branding:ro
      - ./wordpress/mu-plugins:/var/www/html/wp-content/mu-plugins:ro
    depends_on:
      - wp-db
    networks:
      - kecktech_front
      - kecktech_internal
    labels:
      - "traefik.enable=true"
      # www → WordPress; apex → 301 to www (middleware via Docker provider — see Traefik redirectRegex label escaping)
      - "traefik.http.middlewares.kecktech-apex-to-www.redirectregex.regex=^https://kecktech\\.net/(.*)"
      - "traefik.http.middlewares.kecktech-apex-to-www.redirectregex.replacement=https://www.kecktech.net/$${1}"
      - "traefik.http.middlewares.kecktech-apex-to-www.redirectregex.permanent=true"
      - "traefik.http.routers.wordpress-www.rule=Host(`www.kecktech.net`)"
      - "traefik.http.routers.wordpress-www.service=wordpress"
      - "traefik.http.routers.wordpress-www.entrypoints=websecure"
      - "traefik.http.routers.wordpress-www.tls=true"
      - "traefik.http.routers.wordpress-apex.rule=Host(`kecktech.net`)"
      - "traefik.http.routers.wordpress-apex.entrypoints=websecure"
      - "traefik.http.routers.wordpress-apex.tls=true"
      - "traefik.http.routers.wordpress-apex.middlewares=kecktech-apex-to-www@docker"
      - "traefik.http.routers.wordpress-apex.service=noop@internal"
      - "traefik.http.services.wordpress.loadbalancer.server.port=80"

  wp-db:
    image: mariadb:10.6
    container_name: wp-db
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      - MYSQL_ROOT_PASSWORD=${WP_DB_ROOT_PASS}
      - MYSQL_DATABASE=wpdb
      - MYSQL_USER=wpuser
      - MYSQL_PASSWORD=${WP_DB_PASS}
    restart: always
    volumes:
      - ./data/db_data:/var/lib/mysql
    networks:
      - kecktech_internal

  # ── KNOWLEDGE BASE ────────────────────────────────────────────────────────────
  wikijs:
    image: ghcr.io/requarks/wiki:2
    container_name: wikijs
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      - wikijs-db
    volumes:
      - wikijs_data:/wiki/data
    environment:
      - DB_TYPE=postgres
      - DB_HOST=wikijs-db
      - DB_PORT=5432
      - DB_USER=wikijs
      - DB_PASS=${WIKIJS_DB_PASS}
      - DB_NAME=wikijs
    extra_hosts:
      - "mail.kecktech.net:host-gateway"
    restart: always
    networks:
      - kecktech_front
      - kecktech_internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wikijs.rule=Host(`help.kecktech.net`)"
      - "traefik.http.routers.wikijs.entrypoints=websecure"
      - "traefik.http.routers.wikijs.tls=true"
      - "traefik.http.services.wikijs.loadbalancer.server.port=3000"

  wikijs-db:
    image: postgres:15-alpine
    container_name: wikijs-db
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wikijs"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - wikijs_db_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=wikijs
      - POSTGRES_USER=wikijs
      - POSTGRES_PASSWORD=${WIKIJS_DB_PASS}
    restart: always
    networks:
      - kecktech_internal

  # ── ANALYTICS ─────────────────────────────────────────────────────────────────
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: umami
    restart: always
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/heartbeat"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      - DATABASE_URL=postgresql://umami:${UMAMI_DB_PASS}@umami-db:5432/umami
      - APP_SECRET=${UMAMI_APP_SECRET}
    depends_on:
      - umami-db
    networks:
      - kecktech_front
      - kecktech_internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.umami.rule=Host(`stats.kecktech.net`)"
      - "traefik.http.routers.umami.entrypoints=websecure"
      - "traefik.http.routers.umami.tls=true"
      - "traefik.http.services.umami.loadbalancer.server.port=3000"
      - "traefik.http.routers.umami.middlewares=authelia@docker"

  umami-db:
    image: postgres:15-alpine
    container_name: umami-db
    restart: always
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      - POSTGRES_DB=umami
      - POSTGRES_USER=umami
      - POSTGRES_PASSWORD=${UMAMI_DB_PASS}
    volumes:
      - umami_db_data:/var/lib/postgresql/data
    networks:
      - kecktech_internal

  # ── REMOTE ACCESS ─────────────────────────────────────────────────────────────
  # RustDesk requires direct TCP/UDP — ports kept open via UFW rules
  rustdesk-relay:
    image: rustdesk/rustdesk-server:1.1.15
    container_name: rustdesk-relay
    command: hbbr
    volumes:
      - ./data/rustdesk_data:/root
    ports:
      - "21117:21117/tcp"
      - "21119:21119/tcp"
    restart: unless-stopped
    networks:
      - kecktech_front

  rustdesk-id:
    image: rustdesk/rustdesk-server:1.1.15
    container_name: rustdesk-id
    command: hbbs
    volumes:
      - ./data/rustdesk_data:/root
    ports:
      - "21115:21115/tcp"
      - "21116:21116/tcp"
      - "21116:21116/udp"
      - "21118:21118/tcp"
    depends_on:
      - rustdesk-relay
    restart: unless-stopped
    networks:
      - kecktech_front

  # ── DASHBOARD (Next.js — health checks + app tiles) ──────────────────────────
  dashboard:
    build:
      context: ../dashboard
      dockerfile: Dockerfile
    image: kecktech/dashboard:latest
    container_name: dashboard
    restart: always
    mem_limit: 256m
    environment:
      # Zammad — REST API (replaces FreeScout)
      - ZAMMAD_URL=http://zammad-railsserver:3000
      - ZAMMAD_API_TOKEN=${ZAMMAD_API_TOKEN}
      # TRMM — REST API key
      - TRMM_URL=https://trmm-nginx:4443
      - TRMM_API_KEY=${TRMM_API_KEY}
      # ERPNext — API token (key:secret)
      - ERPNEXT_URL=http://frappe_docker-frontend-1:8080
      - ERPNEXT_API_KEY=${ERPNEXT_API_KEY}
      - ERPNEXT_API_SECRET=${ERPNEXT_API_SECRET}
      # Umami — credentials for internal token auth
      - UMAMI_URL=http://umami:3000
      - UMAMI_USER=admin
      - UMAMI_PASS=${UMAMI_PASS}
      - UMAMI_SITE_ID=d2427fe3-ce4b-4b9a-8e41-a8a3e9f2cd6d
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://0.0.0.0:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - kecktech_front
      - kecktech_internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`dashboard.kecktech.net`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.services.dashboard.loadbalancer.server.port=3000"
      - "traefik.http.routers.dashboard.middlewares=authelia@docker"

  # ── CONTAINER MANAGEMENT ──────────────────────────────────────────────────────
  # Portainer accessed directly via Tailscale IP:9443 — not behind Traefik
  portainer:
    image: portainer/portainer-ce:latest  # pinning breaks DB schema migration; keep latest
    container_name: portainer
    restart: always
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    ports:
      - "127.0.0.1:9443:9443"
      - "127.0.0.1:8000:8000"
    networks:
      - kecktech_front

