###############################################################
# Authelia configuration — Kecktech stack
# Secrets injected via environment variables (see docker-compose.yml)
###############################################################

theme: light

authentication_backend:
  ldap:
    address: ldap://lldap:3890
    implementation: lldap
    base_dn: dc=kecktech,dc=net
    additional_users_dn: ou=people
    users_filter: "(&({username_attribute}={input})(objectClass=person))"
    additional_groups_dn: ou=groups
    groups_filter: "(member={dn})"
    user: uid=admin,ou=people,dc=kecktech,dc=net

session:
  name: authelia_session
  cookies:
    - domain: kecktech.net
      authelia_url: https://auth.kecktech.net
      expiration: 12h
      inactivity: 1h

storage:
  local:
    path: /config/db.sqlite3

# Phase 5: SSO enforcement active.
# Public sites bypass auth; admins require two_factor (TOTP); staff require one_factor.
# keckadmin must enroll TOTP on first protected-subdomain visit.
access_control:
  default_policy: deny
  rules:
    # Public-facing sites — no auth required
    - domain:
        - "kecktech.net"
        - "www.kecktech.net"
        - "help.kecktech.net"
      policy: bypass
    # Admin group — requires TOTP (two-factor)
    - domain: "*.kecktech.net"
      subject: "group:kecktech_admins"
      policy: two_factor
    # Staff group — requires password only (one-factor)
    - domain: "*.kecktech.net"
      subject: "group:kecktech_staff"
      policy: one_factor
    # Billing role — access to internal tools (one-factor)
    - domain: "*.kecktech.net"
      subject: "group:kecktech_billing"
      policy: one_factor
    # Support role — access to internal tools (one-factor)
    - domain: "*.kecktech.net"
      subject: "group:kecktech_support"
      policy: one_factor
    # Sales role — access to internal tools (one-factor)
    - domain: "*.kecktech.net"
      subject: "group:kecktech_sales"
      policy: one_factor

notifier:
  disable_startup_check: false
  smtp:
    address: smtp://mail.kecktech.net:587
    username: admin@kecktech.net
    password: ${AUTHELIA_NOTIFIER_SMTP_PASSWORD}
    sender: "Kecktech Auth <admin@kecktech.net>"
    subject: "[Kecktech] {title}"
    tls:
      skip_verify: true

identity_validation:
  reset_password:
    # Use dedicated env name so Authelia does not also map AUTHELIA_JWT_SECRET to deprecated jwt_secret.
    jwt_secret: ${AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET}
